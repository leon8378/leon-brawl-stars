
<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BALKANGG | Brawl Stars</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #09090d;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111116;
    border-bottom: 2px solid #ff3030;
}

.logo {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 2px;
}

.logo span {
    color: #ff3030;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: bold;
}

.hero {
    text-align: center;
    padding: 75px 20px;
    background: linear-gradient(135deg,#180b0b,#111116,#240909);
}

.hero h1 {
    font-size: clamp(38px, 8vw, 65px);
    font-weight: 900;
}

.hero h1 span {
    color: #ff3030;
}

.hero p {
    color: #aaa;
    margin-top: 15px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 35px 20px;
}

.section-title {
    font-size: 26px;
    margin-bottom: 25px;
}

.podium {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 15px;
    margin-bottom: 45px;
}

.podium-card {
    background: #17171e;
    border: 1px solid #333;
    padding: 25px 10px;
    text-align: center;
    border-radius: 12px;
}

.podium-card h2 {
    font-size: 30px;
    margin-bottom: 12px;
}

.gold { color: #ffd43b; }
.silver { color: #c5c5d0; }
.bronze { color: #cd8952; }

.search {
    width: 100%;
    padding: 16px;
    background: #17171e;
    border: 1px solid #444;
    color: white;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 16px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #14141a;
    border-radius: 10px;
    overflow: hidden;
}

th, td {
    padding: 17px 12px;
    text-align: left;
    border-bottom: 1px solid #292932;
}

th {
    color: #ff4545;
    background: #1c1c24;
}

tr:hover {
    background: #22222c;
}

.rank {
    color: #ff4545;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 30px;
    color: #777;
    border-top: 1px solid #292932;
    margin-top: 50px;
}

@media(max-width:600px) {
    nav { display: none; }
    .podium { gap: 7px; }
    .podium-card { padding: 18px 5px; }
    th,td { padding: 12px 6px; font-size: 12px; }
}
</style>
</head>

<body>

<header>
    <div class="logo">BALKAN<span>GG</span></div>
    <nav>
        <a href="#">HOME</a>
        <a href="#rankings">RANKINGS</a>
    </nav>
</header>

<section class="hero">
    <h1>BALKAN<span>GG</span></h1>
    <p>THE HOME OF BALKAN BRAWL STARS</p>
    <p>🇭🇷 CROATIAN CLUB LEADERBOARD</p>
</section>

<main class="container">

    <h2 class="section-title">🏆 TOP 3 CLUBS</h2>

    <div class="podium" id="podium"></div>

    <section id="rankings">
        <h2 class="section-title">🇭🇷 CLUB RANKINGS</h2>

        <input
            class="search"
            id="search"
            placeholder="Search clubs..."
            oninput="renderClubs()"
        >

        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>CLUB</th>
                        <th>TROPHIES</th>
                        <th>MEMBERS</th>
                    </tr>
                </thead>
                <tbody id="clubs"></tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    © 2026 BALKANGG | ALL RIGHTS RESERVED
    <br><br>
    FAN-MADE BRAWL STARS COMMUNITY
</footer>

<script>
// DEMO DATA - NOT LIVE API DATA
const clubData = [
    {name:"BALKAN_KRALJEVI",tag:"#BALKAN",trophies:1000000,members:30},
    {name:"BALKANGG",tag:"#BGG123",trophies:950000,members:30},
    {name:"CROATIAN KINGS",tag:"#CRO123",trophies:900000,members:29},
    {name:"HRVATSKI RATNICI",tag:"#HRV123",trophies:850000,members:30},
    {name:"BALKAN LEGENDS",tag:"#LEG123",trophies:800000,members:28},
    {name:"CRO GAMERS",tag:"#CRO456",trophies:750000,members:30}
];

function renderClubs() {
    const query = document.getElementById("search")
        .value.toLowerCase();

    const filtered = clubData.filter(club =>
        club.name.toLowerCase().includes(query) ||
        club.tag.toLowerCase().includes(query)
    );

    document.getElementById("clubs").innerHTML =
        filtered.map((club,index) => `
            <tr>
                <td class="rank">#${index+1}</td>
                <td>
                    <b>${club.name}</b><br>
                    <small style="color:#888">${club.tag}</small>
                </td>
                <td>🏆 ${club.trophies.toLocaleString("en-US")}</td>
                <td>${club.members}/30</td>
            </tr>
        `).join("");
}

function renderPodium() {
    const medals = ["🥇","🥈","🥉"];
    const colors = ["gold","silver","bronze"];

    document.getElementById("podium").innerHTML =
        clubData.slice(0,3).map((club,index) => `
            <div class="podium-card">
                <h2 class="${colors[index]}">${medals[index]}</h2>
                <h3>${club.name}</h3>
                <p style="color:#aaa;margin-top:12px">
                    ${club.trophies.toLocaleString("en-US")} trophies
                </p>
            </div>
        `).join("");
}

renderClubs();
renderPodium();
</script>

</body>
</html>
